<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c111d" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c7d2fe" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="220" rx="16" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.5" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="160" y1="0" x2="160" y2="220" />
    <line x1="320" y1="0" x2="320" y2="220" />
    <line x1="480" y1="0" x2="480" y2="220" />
    <line x1="640" y1="0" x2="640" y2="220" />
  </g>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="110" cy="110" r="75" fill="url(#glowGrad)" filter="url(#subtleGlow)" />

  <!-- ICON CONTAINER (Hexagon Frame) -->
  <polygon points="110,40 165,70 165,150 110,180 55,150 55,70" 
           fill="#0b0f19" stroke="url(#accentGrad)" stroke-width="2.5" />

  <!-- 21 LANDMARKS HAND SKELETON (Abstract Cyber Hand) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#neonGlow)">
    <!-- Palm / Base -->
    <line x1="110" y1="160" x2="88" y2="125" />  <!-- Wrist to Thumb CMC -->
    <line x1="110" y1="160" x2="98" y2="115" />  <!-- Wrist to Index MCP -->
    <line x1="110" y1="160" x2="110" y2="112" /> <!-- Wrist to Middle MCP -->
    <line x1="110" y1="160" x2="122" y2="116" /> <!-- Wrist to Ring MCP -->
    <line x1="110" y1="160" x2="132" y2="124" /> <!-- Wrist to Pinky MCP -->

    <!-- Knuckle Connectors -->
    <line x1="98" y1="115" x2="110" y2="112" />
    <line x1="110" y1="112" x2="122" y2="116" />
    <line x1="122" y1="116" x2="132" y2="124" />

    <!-- Thumb -->
    <line x1="88" y1="125" x2="78" y2="108" />
    <line x1="78" y1="108" x2="72" y2="92" />
    <line x1="72" y1="92" x2="70" y2="76" />

    <!-- Index Finger (Pointing Up) -->
    <line x1="98" y1="115" x2="96" y2="92" />
    <line x1="96" y1="92" x2="95" y2="74" />
    <line x1="95" y1="74" x2="94" y2="56" />

    <!-- Middle Finger (Curled / Elevated) -->
    <line x1="110" y1="112" x2="110" y2="90" />
    <line x1="110" y1="90" x2="110" y2="72" />
    <line x1="110" y1="72" x2="110" y2="52" />

    <!-- Ring Finger -->
    <line x1="122" y1="116" x2="123" y2="98" />
    <line x1="123" y1="98" x2="124" y2="84" />
    <line x1="124" y1="84" x2="125" y2="70" />

    <!-- Pinky Finger -->
    <line x1="132" y1="124" x2="136" y2="108" />
    <line x1="136" y1="108" x2="138" y2="95" />
    <line x1="138" y1="95" x2="140" y2="82" />
  </g>

  <!-- Landmark Joint Keypoints -->
  <g fill="#a5f3fc" filter="url(#neonGlow)">
    <!-- Wrist -->
    <circle cx="110" cy="160" r="3.5" fill="#34d399" />
    
    <!-- Thumb Nodes -->
    <circle cx="88" cy="125" r="2.5" />
    <circle cx="78" cy="108" r="2.5" />
    <circle cx="72" cy="92" r="2.5" />
    <circle cx="70" cy="76" r="3.5" fill="#67e8f9" />

    <!-- Index Nodes -->
    <circle cx="98" cy="115" r="2.5" />
    <circle cx="96" cy="92" r="2.5" />
    <circle cx="95" cy="74" r="2.5" />
    <circle cx="94" cy="56" r="3.5" fill="#67e8f9" />

    <!-- Middle Nodes -->
    <circle cx="110" cy="112" r="2.5" />
    <circle cx="110" cy="90" r="2.5" />
    <circle cx="110" cy="72" r="2.5" />
    <circle cx="110" cy="52" r="3.5" fill="#67e8f9" />

    <!-- Ring Nodes -->
    <circle cx="122" cy="116" r="2.5" />
    <circle cx="123" cy="98" r="2.5" />
    <circle cx="124" cy="84" r="2.5" />
    <circle cx="125" cy="70" r="3" fill="#67e8f9" />

    <!-- Pinky Nodes -->
    <circle cx="132" cy="124" r="2.5" />
    <circle cx="136" cy="108" r="2.5" />
    <circle cx="138" cy="95" r="2.5" />
    <circle cx="140" cy="82" r="3" fill="#67e8f9" />
  </g>

  <!-- TYPOGRAPHY / BRAND NAME -->
  <text x="210" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', sans-serif" 
        font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#textGrad)">
    GestureForge
  </text>

  <!-- Subtitle / Tagline -->
  <text x="212" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
        font-size="16" font-weight="600" letter-spacing="3" fill="#94a3b8" text-transform="uppercase">
    REAL-TIME AI GESTURE RECOGNITION ENGINE
  </text>

  <!-- Stack Pills at Bottom Right -->
  <g transform="translate(212, 172)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">
    <!-- MediaPipe -->
    <rect x="0" y="0" width="86" height="22" rx="4" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.3)" />
    <text x="8" y="15" fill="#38bdf8">MediaPipe</text>

    <!-- FastAPI -->
    <rect x="94" y="0" width="70" height="22" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="102" y="15" fill="#34d399">FastAPI</text>

    <!-- React -->
    <rect x="172" y="0" width="60" height="22" rx="4" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(99, 102, 241, 0.3)" />
    <text x="180" y="15" fill="#818cf8">React</text>

    <!-- OpenCV -->
    <rect x="240" y="0" width="68" height="22" rx="4" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.3)" />
    <text x="248" y="15" fill="#fb7185">OpenCV</text>
  </g>
</svg>
