name: GestureForge CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-ci:
    name: Backend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code syntax verification
        run: |
          python -m py_compile app.py config.py gesture.py routes/health.py

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest tests/

      - name: Verify FastAPI server startup & health check
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 4
          curl --fail --retry 3 --retry-delay 2 http://127.0.0.1:8000/health || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID

  frontend-ci:
    name: Frontend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend distribution bundle
        run: npm run build
