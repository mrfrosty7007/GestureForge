name: GestureForge CI

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-ci:
    name: Backend Validation (uv + Python)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies from uv.lock
        run: uv sync

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Black Code Formatting Check
        run: uv run black --check backend ai-model

      - name: Run Backend Pytest Suite
        run: uv run pytest

      - name: Verify FastAPI Server Startup & Health Check
        run: |
          uv run uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 4
          curl --fail --retry 3 --retry-delay 2 http://127.0.0.1:8000/health || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID

  frontend-ci:
    name: Frontend Validation (Node.js + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code style with Prettier
        run: pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Build frontend production bundle
        run: pnpm run build

  e2e-ci:
    name: End-to-End Testing (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync Python backend dependencies
        working-directory: ./
        run: uv sync

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers & OS dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E test suite
        run: pnpm run test:e2e

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
